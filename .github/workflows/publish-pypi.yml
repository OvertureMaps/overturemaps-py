---
# Publishes the overturemaps package in two scenarios:
#   1. Release (production): triggered when a GitHub Release is published → publishes to PyPI.
#   2. Dry-run: triggered manually via workflow_dispatch → publishes to Test PyPI to verify
#      the build and publish pipeline end-to-end without affecting the production package index.
# Uses OIDC trusted publishing — no API token required.
name: Publish overturemaps-py

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read # required to checkout the code from the repo

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Build package
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Target '${{ github.event_name == 'workflow_dispatch' && 'Test PyPI' || 'PyPI' }}'
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'test-pypi' || 'pypi' }}
    env:
      TEST_PYPI_URL: https://test.pypi.org/legacy/
    permissions:
      id-token: write # OIDC — required for PyPI trusted publishing
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ github.event_name == 'workflow_dispatch' && env.TEST_PYPI_URL || '' }}
          skip-existing: ${{ github.event_name == 'workflow_dispatch' }} # Don't fail on version conflicts during test-publishing
          attestations: true
          verbose: false
