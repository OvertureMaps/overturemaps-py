# Cuts a GitHub Release from Conventional Commits on every push to main.
# Nothing is committed back to main; release notes are generated on the GitHub Release.
#
# The release is created as a draft, binaries are attached to it, then it is published.
# Releases are immutable once published, so assets cannot be added afterwards.
#
# The release is created and published with the overture-releaser GitHub App's token, not
# GITHUB_TOKEN: GITHUB_TOKEN-published releases don't fire `release: published`.
name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Create draft release
    if: github.repository == 'OvertureMaps/overturemaps-py'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.created }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    permissions:
      contents: read
      id-token: write # OIDC access for the releaser-token action
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Generate app token
        id: app-token
        uses: OvertureMaps/workflows/.github/actions/releaser-token@9ddbb7ea0b8d5b08d0cee86823605c4b1202864c # v1.0.0

      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # semantic-release also writes tag/version to GITHUB_OUTPUT, even with no release;
          # `created` is the only reliable signal that a draft exists.
          version=$(uv run --only-group release semantic-release version --print)
          tag="v${version}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists; no releasable commits."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "${tag}" --generate-notes --draft
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  binaries:
    name: Build binaries
    needs: release
    if: needs.release.outputs.created == 'true'
    permissions:
      contents: write # upload assets to the draft release
    uses: $/.github/workflows/build-binaries.yml
    with:
      tag: ${{ needs.release.outputs.tag }}

  publish:
    name: Publish release
    needs: [release, binaries]
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC access for the releaser-token action
    steps:
      - name: Generate app token
        id: app-token
        uses: OvertureMaps/workflows/.github/actions/releaser-token@9ddbb7ea0b8d5b08d0cee86823605c4b1202864c # v1.0.0

      - name: Publish release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest

  notify:
    name: Comment on released PRs
    needs: [release, publish]
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-slim
    permissions:
      contents: read
      issues: write # comment on and label closed issues
      pull-requests: write # comment on and label released PRs
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Comment on released PRs and issues
        uses: lowlysre/psr-success-comment@9d3379b775ba7f6fd8b10e5b3dd8a4afe289ceb5 # v1.0.0
        with:
          tag: ${{ needs.release.outputs.tag }}
          version: ${{ needs.release.outputs.version }}
          release-url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.release.outputs.tag }}
